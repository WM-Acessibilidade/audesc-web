<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detalhes das avaliações — Audesc</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><p><a href="avaliacoes.html">Voltar para avaliações das transmissões</a></p><h1>Detalhes das avaliações</h1><div id="resumo"></div><div id="lista" aria-live="polite">Carregando avaliações...</div></main><script>(()=>{'use strict';const API='https://audesc-events-api.onrender.com',q=new URLSearchParams(location.search),token=sessionStorage.getItem('audesc_admin_token_avaliacoes')||'',resumo=document.getElementById('resumo'),lista=document.getElementById('lista');function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;")}function dataBR(v){const d=new Date(v);return Number.isNaN(d.getTime())?'Data não informada':d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}async function ler(r){const t=await r.text();let j={};if(t)try{j=JSON.parse(t)}catch{j={error:t}}if(!r.ok)throw new Error(j.error||`Erro ${r.status}.`);return j}async function carregar(){try{if(!token)throw new Error('Volte à página de avaliações e carregue as avaliações novamente.');const p=new URLSearchParams({tipo:q.get('tipo')||''});if(q.get('tipo')==='instantanea')p.set('pedido_id',q.get('pedido_id')||'');else{p.set('evento_id',q.get('evento_id')||'');p.set('ciclo',q.get('ciclo')||'')}const j=await ler(await fetch(`${API}/admin/avaliacoes/detalhes?${p}`,{headers:{'x-admin-token':token},cache:'no-store'}));resumo.innerHTML=`<p><strong>Sala:</strong> ${esc(j.sala_codigo||'—')}</p><p><strong>Tipo:</strong> ${esc(j.tipo_rotulo)}</p><p><strong>Data e hora:</strong> ${esc(dataBR(j.data_hora))}</p><p><strong>Total:</strong> ${(j.respostas||[]).length} resposta(s).</p>`;if(!(j.respostas||[]).length){lista.innerHTML='<p>Não há respostas registradas neste ciclo.</p>';return}if(j.tipo==='instantanea')lista.innerHTML=j.respostas.map((x,i)=>`<article><h2>Resposta ${i+1}</h2><p><strong>Ouvinte:</strong> ${esc(x.nome_ouvinte||'Ouvinte')}</p><p><strong>Nota:</strong> ${esc(x.nota)} de 5</p>${x.comentario?`<p><strong>Comentário:</strong> ${esc(x.comentario)}</p>`:''}<p><strong>Enviada em:</strong> ${esc(dataBR(x.criado_em))}</p></article>`).join('');else lista.innerHTML=j.respostas.map((x,i)=>`<article><h2>Resposta ${i+1}</h2><p>Avaliação geral: ${x.avaliacao_geral??'—'} de 5</p><p>Qualidade da audiodescrição: ${x.qualidade_audiodescricao??'—'} de 5</p><p>Qualidade do áudio: ${x.qualidade_audio??'—'} de 5</p><p>Autonomia: ${x.autonomia??'—'} de 5</p><p>Recomendação: ${x.recomendacao??'—'}</p>${x.comentario?`<p><strong>Comentário:</strong> ${esc(x.comentario)}</p>`:''}<p><strong>Enviada em:</strong> ${esc(dataBR(x.atualizada_em))}</p></article>`).join('')}catch(e){lista.innerHTML='<p>Não foi possível carregar os detalhes: '+esc(e.message)+'</p>'}}carregar()})();</script></body></html>
