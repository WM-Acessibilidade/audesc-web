<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repositório — Audire</title><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;margin:0;background:#f7f7f7;color:#111}header,main{max-width:900px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid #ccc;border-radius:12px;padding:20px;margin:16px 0}.capa{max-width:100%;height:auto;border-radius:10px}.button,button{font:inherit;display:inline-block;padding:10px 14px;margin:4px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.secondary{background:#555}.status,.notice{padding:12px;border:1px solid #aaa;border-radius:8px;background:#f1f1f1;margin:12px 0}.notice{border-color:#9a6700;background:#fff8df}.share{margin-top:22px}.roteiros li{margin:10px 0}@media(max-width:650px){header,main{padding:12px}.button,button{display:block;width:100%;box-sizing:border-box;margin:8px 0}}</style></head><body><header><a href="repositorios.html" id="voltar">Voltar</a><h1 id="titulo">Repositório</h1></header><main><div id="status" class="status" role="status" aria-live="polite">Carregando repositório.</div><article id="conteudo" class="panel" hidden></article></main><script>
const API='https://audesc-events-api.onrender.com',FOCUS='audire_roteiro_retorno_v1',ACCESS='audire_presenca_repo_';let repo=null;function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function accessKey(id){return ACCESS+id}function getAccess(id){return sessionStorage.getItem(accessKey(id))||''}function setAccess(id,t){if(t)sessionStorage.setItem(accessKey(id),t)}
function shareUrl(){const u=new URL(location.href);u.searchParams.delete('acesso');return u.toString()}function wa(t,u){open('https://api.whatsapp.com/send?text='+encodeURIComponent(t+' '+u),'_blank')}function fb(u){open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(u),'_blank')}function tw(t,u){open('https://twitter.com/intent/tweet?text='+encodeURIComponent(t)+'&url='+encodeURIComponent(u),'_blank')}function li(u){open('https://www.linkedin.com/sharing/share-offsite/?url='+encodeURIComponent(u),'_blank')}async function copy(u,msg='Link copiado.'){try{await navigator.clipboard.writeText(u);document.getElementById('shareStatus').textContent=msg}catch{prompt('Copie o link:',u)}}async function insta(t,u){if(navigator.share){try{await navigator.share({title:t,url:u});document.getElementById('shareStatus').textContent='Compartilhamento aberto. Selecione o Instagram, se disponível no dispositivo.';return}catch(e){if(e.name==='AbortError')return}}await copy(u,'Link copiado. Abra o Instagram e cole o link onde desejar compartilhar.')}
function linksHtml(a){const links=(Array.isArray(a)?a:[]).filter(x=>['repositorio','ambos'].includes(x.exibir_em||'ambos'));return links.length?`<div class="links-adicionais"><h2>Links adicionais</h2><ul>${links.map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.nome)}</a></li>`).join('')}</ul></div>`:''}
function mapa(r){const lat=Number(r.latitude),lon=Number(r.longitude);if(Number.isFinite(lat)&&Number.isFinite(lon))return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(lat+','+lon);if(r.endereco||r.nome_local)return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(r.endereco||r.nome_local);return''}
function obterGps(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no(new Error('Geolocalização não disponível neste dispositivo.'));navigator.geolocation.getCurrentPosition(ok,e=>no(new Error(e.message||'Não foi possível obter a localização.')),{enableHighAccuracy:true,timeout:15000,maximumAge:30000})})}
async function validarPresenca(){const st=document.getElementById('presencaStatus');st.textContent='Solicitando localização do dispositivo para validar sua presença...';const p=await obterGps(),r=await fetch(API+'/audire/public/repositorios/'+encodeURIComponent(repo.id)+'/validar-presenca',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy||0})}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Não foi possível validar sua presença.');setAccess(repo.id,j.token);st.textContent='Presença validada. Os roteiros deste repositório estão liberados nesta sessão.';return j.token}
async function abrirRoteiro(id,a){sessionStorage.setItem(FOCUS,id);if(repo.exigir_presenca_roteiros&&!getAccess(repo.id)){a.preventDefault();try{await validarPresenca();location.href='roteiro.html?id='+encodeURIComponent(id)+'&repositorio='+encodeURIComponent(repo.id)}catch(e){document.getElementById('presencaStatus').textContent='Não foi possível liberar o roteiro: '+e.message}return false}return true}
function render(){document.title=repo.titulo+' — Audire';document.getElementById('titulo').textContent=repo.titulo;const u=shareUrl(),rota=mapa(repo),aviso=repo.exigir_presenca_roteiros?`<div class="notice"><strong>Aviso de acesso aos roteiros:</strong> os roteiros deste repositório estão disponíveis apenas para visitantes presentes no local. Ao abrir o primeiro roteiro, o Audire solicitará a localização do dispositivo para validar a presença. O acesso por QR Code dispensa essa validação.</div><div id="presencaStatus" class="status" role="status" aria-live="polite">${getAccess(repo.id)?'Acesso aos roteiros já liberado nesta sessão.':'Presença ainda não validada nesta sessão.'}</div>`:'';document.getElementById('conteudo').innerHTML=`${repo.imagem_url?`<img class="capa" src="${esc(repo.imagem_url)}" alt="${esc(repo.imagem_alt||'')}"><p><button id="altBtn" class="secondary" type="button" aria-expanded="false">Exibir texto alternativo</button></p><div id="altTexto" class="status" hidden>${esc(repo.imagem_alt||'Sem texto alternativo cadastrado.')}</div>`:''}<h2>Descrição</h2><p>${esc(repo.descricao||'')}</p>${linksHtml(repo.links_adicionais)}${repo.nome_local||repo.endereco?`<p><strong>Local:</strong> ${esc(repo.nome_local||repo.endereco)}</p>`:''}${rota?`<p><a class="button secondary" href="${rota}" target="_blank" rel="noopener">Abrir rota até o local</a></p>`:''}${aviso}<h2>Roteiros de audiodescrição</h2><ul class="roteiros">${(repo.roteiros||[]).map(r=>`<li><a id="roteiro-${esc(r.id)}" href="roteiro.html?id=${encodeURIComponent(r.id)}&repositorio=${encodeURIComponent(repo.id)}" data-rid="${esc(r.id)}">${esc(r.titulo)}</a></li>`).join('')||'<li>Nenhum roteiro publicado.</li>'}</ul><div class="share"><h2>Compartilhar</h2><button onclick="wa('${esc(repo.titulo)}','${u}')">WhatsApp</button><button onclick="fb('${u}')">Facebook</button><button onclick="tw('${esc(repo.titulo)}','${u}')">X</button><button onclick="li('${u}')">LinkedIn</button><button onclick="insta('${esc(repo.titulo)}','${u}')">Instagram</button><button onclick="copy('${u}')">Copiar link</button><div id="shareStatus" class="status" role="status" aria-live="polite">Escolha uma opção de compartilhamento.</div></div>`;document.getElementById('conteudo').hidden=false;document.getElementById('status').hidden=true;if(document.getElementById('altBtn'))document.getElementById('altBtn').onclick=()=>{const d=document.getElementById('altTexto'),b=document.getElementById('altBtn');d.hidden=!d.hidden;b.textContent=d.hidden?'Exibir texto alternativo':'Ocultar texto alternativo';b.setAttribute('aria-expanded',String(!d.hidden))};document.querySelectorAll('[data-rid]').forEach(a=>a.addEventListener('click',e=>abrirRoteiro(a.dataset.rid,e)));const rid=sessionStorage.getItem(FOCUS);if(rid){const el=document.getElementById('roteiro-'+CSS.escape(rid));if(el){sessionStorage.removeItem(FOCUS);setTimeout(()=>el.focus(),0)}}}
async function load(){const p=new URLSearchParams(location.search),id=p.get('id'),acesso=p.get('acesso');if(!id){document.getElementById('status').textContent='Repositório não informado.';return}if(acesso)setAccess(id,acesso);try{const r=await fetch(API+'/audire/public/repositorios/'+encodeURIComponent(id)),j=await r.json();if(!r.ok)throw new Error(j.error||'Erro na API');repo=j.repositorio;render()}catch(e){document.getElementById('status').textContent='Erro: '+e.message}}load();
</script></body></html>
