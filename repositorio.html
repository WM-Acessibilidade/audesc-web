<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repositório — Audire</title><style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;margin:0;background:#f7f7f7;color:#111}header,main{max-width:900px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid #ccc;border-radius:12px;padding:18px;margin:16px 0}.capa{max-width:100%;max-height:520px;border-radius:10px}.status{padding:10px;border:1px solid #aaa;border-radius:8px;background:#f1f1f1}.roteiros{padding-left:1.4rem}.roteiros li{margin:.8rem 0}button,.button{font:inherit;padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;margin:4px}.secondary{background:#555}.imagem-alt{border-left:4px solid #777;padding-left:12px}
</style></head><body><header><p><a href="repositorios.html" id="voltar">Voltar</a></p><h1 id="titulo">Repositório</h1></header><main><div id="status" class="status" role="status" aria-live="polite">Carregando repositório.</div><article id="conteudo" hidden>
<section class="panel" id="imagemBox"><img id="imagem" class="capa" alt=""><p><button id="toggleAlt" type="button" class="secondary" aria-expanded="false" aria-controls="textoAlt">Ver descrição da imagem</button></p><p id="textoAlt" class="imagem-alt" hidden></p></section>
<section class="panel"><h2>Sobre este repositório</h2><p id="descricao"></p><p id="categoria"></p><p id="local"></p><p id="rotaBox"></p></section>
<section class="panel"><h2>Roteiros de audiodescrição</h2><ol id="roteiros" class="roteiros"></ol></section>
<section class="panel"><h2>Compartilhar este repositório</h2><button id="share" type="button">Compartilhar</button><button id="copy" class="secondary" type="button">Copiar link</button><div id="shareStatus" class="status" role="status" aria-live="polite">Pronto para compartilhar.</div></section>
</article></main><script src="data/audire-categorias.js"></script><script>
const API='https://audesc-events-api.onrender.com',ROTEIRO_FOCUS='audire_roteiro_retorno_v1';const id=new URLSearchParams(location.search).get('id');let repo=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function restaurarFoco(){const rid=sessionStorage.getItem(ROTEIRO_FOCUS);if(!rid)return;const a=document.getElementById('roteiro-'+CSS.escape(rid));if(a){sessionStorage.removeItem(ROTEIRO_FOCUS);setTimeout(()=>a.focus(),0)}}
function rota(r){if(Number.isFinite(Number(r.latitude))&&Number.isFinite(Number(r.longitude)))return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(r.latitude+','+r.longitude)}`;if(r.endereco||r.nome_local)return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.endereco||r.nome_local)}`;return ''}
async function load(){if(!id){document.getElementById('status').textContent='Repositório não informado.';return}try{const res=await fetch(API+'/audire/public/repositorios/'+encodeURIComponent(id)),j=await res.json();if(!res.ok)throw new Error(j.error||'Erro na API');repo=j.repositorio;document.title=repo.titulo+' — Audire';document.getElementById('titulo').textContent=repo.titulo;document.getElementById('descricao').textContent=repo.descricao||'';document.getElementById('categoria').innerHTML='<strong>Categoria:</strong> '+esc(window.AUDIRE_CATEGORIAS?.nome(repo.categoria)||repo.categoria||'Não informada');document.getElementById('local').textContent=[repo.nome_local,repo.endereco,repo.unidade_administrativa,repo.pais].filter(Boolean).join(' — ');const img=document.getElementById('imagem'),box=document.getElementById('imagemBox');if(repo.imagem_url){img.src=repo.imagem_url;img.alt=repo.imagem_alt||'';document.getElementById('textoAlt').textContent=repo.imagem_alt||'Não há descrição da imagem cadastrada.'}else box.hidden=true;const rt=rota(repo);document.getElementById('rotaBox').innerHTML=rt?`<a class="button" href="${rt}" target="_blank" rel="noopener">Abrir rota para o local</a>`:'';const lista=document.getElementById('roteiros'),roteiros=repo.roteiros||[];lista.innerHTML=roteiros.length?roteiros.map(r=>`<li><a id="roteiro-${esc(r.id)}" data-id="${esc(r.id)}" href="roteiro.html?id=${encodeURIComponent(r.id)}&repositorio=${encodeURIComponent(repo.id)}">${esc(r.titulo)}</a></li>`).join(''):'<li>Nenhum roteiro publicado neste repositório.</li>';lista.querySelectorAll('a[data-id]').forEach(a=>a.addEventListener('click',()=>sessionStorage.setItem(ROTEIRO_FOCUS,a.dataset.id)));document.getElementById('status').hidden=true;document.getElementById('conteudo').hidden=false;restaurarFoco()}catch(e){document.getElementById('status').textContent='Erro: '+e.message}}
document.getElementById('toggleAlt').onclick=()=>{const p=document.getElementById('textoAlt'),b=document.getElementById('toggleAlt'),show=p.hidden;p.hidden=!show;b.setAttribute('aria-expanded',show?'true':'false');b.textContent=show?'Ocultar descrição da imagem':'Ver descrição da imagem'};document.getElementById('share').onclick=async()=>{const st=document.getElementById('shareStatus');try{if(navigator.share)await navigator.share({title:repo?.titulo||'Audire',url:location.href});else{await navigator.clipboard.writeText(location.href);st.textContent='Link copiado para a área de transferência.'}}catch(e){if(e.name!=='AbortError')st.textContent='Não foi possível compartilhar: '+e.message}};document.getElementById('copy').onclick=async()=>{const st=document.getElementById('shareStatus');try{await navigator.clipboard.writeText(location.href);st.textContent='Link copiado para a área de transferência.'}catch(e){st.textContent='Não foi possível copiar o link.'}};load();
</script></body></html>
