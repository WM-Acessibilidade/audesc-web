<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitoramento de salas — Audesc</title><style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;margin:0;background:#f7f7f7;color:#111}header,main{max-width:1100px;margin:auto;padding:16px}.panel,.card{background:#fff;border:1px solid #ccc;border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.summary{font-weight:700;font-size:1.05rem}button,select,input{font:inherit;padding:10px;border-radius:8px}button{border:0;background:#111;color:#fff;font-weight:700;margin:5px 8px 5px 0;cursor:pointer}.danger{background:#950000}.secondary{background:#555}.status{padding:10px;border:1px solid #aaa;border-radius:8px;background:#f3f3f3}.ok{border-color:#237a3b;background:#e8f6ec}.error{border-color:#a40000;background:#fff0f0}.badge{display:inline-block;border:1px solid #777;border-radius:999px;padding:2px 8px;margin-right:6px}audio{width:100%;margin-top:10px}@media(max-width:650px){button{display:block;width:100%;margin:8px 0}.grid{grid-template-columns:1fr}}
</style></head><body><header><p><a href="admin.html">Voltar para o painel administrativo</a></p><h1>Monitoramento de salas</h1><p>Visão operacional das transmissões Audesc, incluindo eventos e demonstrações.</p></header><main>
<section class="panel" id="loginPanel"><h2>Acesso administrativo</h2><label for="adminToken">Senha administrativa</label><input id="adminToken" type="password"><button id="loginBtn" type="button">Entrar</button><div id="loginStatus" class="status" role="status" aria-live="polite">Informe a senha administrativa.</div></section>
<section id="monitorPanel" hidden><div class="panel"><h2>Resumo</h2><div id="summary" class="summary">Aguardando atualização.</div><p><label for="tipoFiltro">Filtrar tipo de sala</label> <select id="tipoFiltro"><option value="todos">Todas</option><option value="evento">Eventos</option><option value="demonstracao">Demonstrações</option></select> <button id="refreshBtn" type="button">Atualizar agora</button></p><div id="status" class="status" role="status" aria-live="polite">Aguardando.</div></div><section class="panel"><h2>Ao vivo agora</h2><div id="aoVivo"></div></section><section class="panel"><h2>Próximas 24 horas</h2><div id="proximas"></div></section><section class="panel"><h2>Últimas 24 horas</h2><div id="ultimas"></div></section></section></main>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script><script>
const API='https://audesc-events-api.onrender.com',SESSION='audesc_admin_session_v1';let token='',dados=null,monitorRoom=null,monitorSala='';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function st(id,msg,cls=''){const e=document.getElementById(id);e.textContent=msg;e.className='status'+(cls?' '+cls:'')}async function api(path,opt={}){const h=Object.assign({'Content-Type':'application/json','x-admin-token':token},opt.headers||{}),r=await fetch(API+path,Object.assign({},opt,{headers:h})),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erro na API');return j}function fmt(v){if(!v)return'Não informado';const d=new Date(v);return Number.isNaN(d.getTime())?'Não informado':d.toLocaleString('pt-BR')}function tipoOk(x){const f=document.getElementById('tipoFiltro').value;return f==='todos'||x.tipo_sala===f}
function cardAgenda(x){return `<article class="card"><h3>${esc(x.titulo||x.sala_codigo)}</h3><p><span class="badge">${x.tipo_sala==='demonstracao'?'Demonstração':'Evento'}</span></p><div class="grid"><div><strong>Sala:</strong> ${esc(x.sala_codigo)}</div><div><strong>Horário:</strong> ${esc(fmt(x.data_evento))}</div><div><strong>Status:</strong> ${esc(x.status_operacao||'—')}</div></div></article>`}
function render(){if(!dados)return;const f=a=>(a||[]).filter(tipoOk);document.getElementById('summary').textContent=`Salas ao vivo: ${dados.resumo.salas_ao_vivo}. Ouvintes conectados: ${dados.resumo.ouvintes_ao_vivo}. Salas sem transmissor: ${dados.resumo.salas_sem_transmissor}.`;const live=f(dados.ao_vivo);document.getElementById('aoVivo').innerHTML=live.length?live.map(x=>`<article class="card"><h3>${esc(x.titulo||x.sala_codigo)}</h3><p><span class="badge">${x.tipo_sala==='demonstracao'?'Demonstração':x.tipo_sala==='evento'?'Evento':'Sala'}</span></p><div class="grid"><div><strong>Sala:</strong> ${esc(x.sala_codigo)}</div><div><strong>Ouvintes:</strong> ${x.ouvintes}</div><div><strong>Transmissor:</strong> ${x.transmissor_presente?'presente':'não conectado'}</div><div><strong>Participantes:</strong> ${x.participantes_total}</div></div><p><button type="button" onclick="ouvir('${encodeURIComponent(x.sala_codigo)}',this)">Ouvir transmissão</button><button class="secondary" type="button" onclick="pararOuvir()">Parar monitoramento</button><button class="danger" type="button" onclick="encerrar('${encodeURIComponent(x.sala_codigo)}',this)">Encerrar transmissão</button></p><div class="status salaStatus" role="status" aria-live="polite">Sala em monitoramento operacional.</div><div class="audioBox"></div></article>`).join(''):'<p>Nenhuma sala está ao vivo neste momento.</p>';const p=f(dados.proximas_24h),u=f(dados.ultimas_24h);document.getElementById('proximas').innerHTML=p.length?p.map(cardAgenda).join(''):'<p>Nenhuma sala programada para as próximas 24 horas.</p>';document.getElementById('ultimas').innerHTML=u.length?u.map(cardAgenda).join(''):'<p>Nenhuma sala encontrada nas últimas 24 horas.</p>'}
async function carregar(){const b=document.getElementById('refreshBtn');b.disabled=true;st('status','Atualizando monitoramento...');try{dados=await api('/admin/monitoramento');render();st('status','Monitoramento atualizado em '+fmt(dados.atualizado_em)+'.','ok')}catch(e){st('status','Erro: '+e.message,'error')}finally{b.disabled=false}}
async function ouvir(salaEnc,btn){const sala=decodeURIComponent(salaEnc),card=btn.closest('.card'),status=card.querySelector('.salaStatus'),box=card.querySelector('.audioBox');status.textContent='Conectando ao áudio da sala...';try{await pararOuvir();const j=await api('/admin/monitoramento/'+encodeURIComponent(sala)+'/token',{method:'POST'});monitorRoom=new LivekitClient.Room();monitorSala=sala;monitorRoom.on(LivekitClient.RoomEvent.TrackSubscribed,track=>{if(track.kind==='audio'){const el=track.attach();el.autoplay=true;el.controls=true;box.innerHTML='';box.appendChild(el);el.play().catch(()=>{});status.textContent='Monitoramento de áudio ativo.'}});await monitorRoom.connect(j.livekit_url,j.token,{autoSubscribe:true});status.textContent='Conectado à sala. Aguardando áudio do transmissor.'}catch(e){status.textContent='Erro ao monitorar: '+e.message;await pararOuvir()}}
async function pararOuvir(){if(monitorRoom){try{monitorRoom.disconnect()}catch{}monitorRoom=null;monitorSala=''}document.querySelectorAll('.audioBox').forEach(x=>x.innerHTML='')}
async function encerrar(salaEnc,btn){const sala=decodeURIComponent(salaEnc);if(!confirm('Confirma o encerramento da transmissão da sala '+sala+'? Todos os participantes serão desconectados.'))return;const card=btn.closest('.card'),status=card.querySelector('.salaStatus');btn.disabled=true;status.textContent='Encerrando transmissão...';try{if(monitorSala===sala)await pararOuvir();await api('/admin/monitoramento/'+encodeURIComponent(sala)+'/encerrar',{method:'POST'});status.textContent='Transmissão encerrada pelo administrador.';setTimeout(carregar,500)}catch(e){status.textContent='Erro: '+e.message;btn.disabled=false}}
async function entrar(){token=token||document.getElementById('adminToken').value.trim();if(!token){st('loginStatus','Informe a senha.','error');return}st('loginStatus','Validando acesso...');try{dados=await api('/admin/monitoramento');sessionStorage.setItem(SESSION,JSON.stringify({token}));document.getElementById('loginPanel').hidden=true;document.getElementById('monitorPanel').hidden=false;render();st('status','Monitoramento carregado.','ok')}catch(e){token='';st('loginStatus','Acesso não autorizado ou erro: '+e.message,'error')}}
document.getElementById('loginBtn').onclick=entrar;document.getElementById('refreshBtn').onclick=carregar;document.getElementById('tipoFiltro').onchange=render;try{const s=JSON.parse(sessionStorage.getItem(SESSION)||'null');if(s?.token)token=s.token}catch{}if(token)entrar();setInterval(()=>{if(!document.getElementById('monitorPanel').hidden)carregar()},30000);
</script></body></html>
