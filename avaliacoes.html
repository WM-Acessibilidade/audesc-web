<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avaliações das transmissões — Audesc</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><h1>Avaliações das transmissões</h1><p><a href="admin.html">Voltar ao painel</a></p><section><h2>Configurações</h2><label>Token administrativo <input id="token" type="password"></label><label><input id="ativa" type="checkbox" checked> Ativar avaliações</label><label>Prazo após o término <select id="prazo"><option value="30">30 minutos</option><option value="60" selected>60 minutos</option><option value="120">120 minutos</option></select></label><label>Participação mínima <input id="minimo" type="number" min="0" max="60" value="1"> minutos</label><label><input id="edicao" type="checkbox" checked> Permitir edição durante o prazo</label><label><input id="comentario" type="checkbox" checked> Exibir campo de comentário</label><button id="salvar">Salvar configurações</button><div id="status" role="status" aria-live="polite"></div></section><section><h2>Resultados recentes</h2><button id="carregar">Carregar avaliações</button><div id="resultados"></div></section></main><script>const API='https://audesc-events-api.onrender.com';const headers=()=>({'Content-Type':'application/json','x-admin-token':token.value});async function carregarConfig(){const r=await fetch(API+'/admin/avaliacoes/configuracao',{headers:headers()});const j=await r.json();if(!r.ok)throw Error(j.error);ativa.checked=j.config.ativa;prazo.value=j.config.prazo_minutos;minimo.value=j.config.participacao_minima_minutos;edicao.checked=j.config.permitir_edicao;comentario.checked=j.config.comentario_ativo}salvar.onclick=async()=>{try{const r=await fetch(API+'/admin/avaliacoes/configuracao',{method:'PUT',headers:headers(),body:JSON.stringify({ativa:ativa.checked,prazo_minutos:Number(prazo.value),participacao_minima_minutos:Number(minimo.value),permitir_edicao:edicao.checked,comentario_ativo:comentario.checked})});const j=await r.json();if(!r.ok)throw Error(j.error);status.textContent='Configurações salvas.'}catch(e){status.textContent=e.message}};carregar.onclick=async()=>{try{await carregarConfig();const r=await fetch(API+'/admin/avaliacoes',{headers:headers()});const j=await r.json();if(!r.ok)throw Error(j.error);resultados.innerHTML='<p>'+j.avaliacoes.length+' avaliação(ões).</p>'+j.avaliacoes.map(a=>'<article><strong>Sala '+a.sala_codigo+'</strong><p>Geral: '+a.avaliacao_geral+'/5; audiodescrição: '+a.qualidade_audiodescricao+'/5; áudio: '+a.qualidade_audio+'/5; autonomia: '+a.autonomia+'/5; recomendação: '+(a.recomendacao??'não respondida')+'</p><p>'+((a.comentario||'').replace(/[<>]/g,''))+'</p></article>').join('')}catch(e){resultados.textContent=e.message}};</script></body></html>
