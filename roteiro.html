<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roteiro — Audire</title><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65;margin:0;background:#f7f7f7;color:#111}header,main{max-width:900px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid #ccc;border-radius:12px;padding:20px;margin:16px 0}.imagem{max-width:100%;height:auto;border-radius:10px}button{font:inherit;padding:10px 14px;margin:5px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#555}.status{padding:10px;border:1px solid #aaa;border-radius:8px;background:#f1f1f1;margin:10px 0}.roteiro-texto{white-space:pre-wrap}.controles{margin:12px 0}.share{margin-top:24px}@media(max-width:650px){header,main{padding:12px}button{display:block;width:100%;margin:8px 0}}</style></head><body><header><a id="voltar" href="repositorio.html">Voltar</a><p id="repoNome"></p><h1 id="titulo">Roteiro</h1></header><main><div id="status" class="status" role="status" aria-live="polite">Carregando roteiro.</div><article id="conteudo" class="panel" hidden></article></main><script>
const API='https://audesc-events-api.onrender.com',ACCESS='audire_presenca_repo_';let r=null,audio=null;function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function fmt(s){s=Math.max(0,Math.floor(Number(s)||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function getAccess(id){return sessionStorage.getItem(ACCESS+id)||''}function setAccess(id,t){if(t)sessionStorage.setItem(ACCESS+id,t)}function shareUrl(){const u=new URL(location.href);u.searchParams.delete('acesso');return u.toString()}function wa(t,u){open('https://api.whatsapp.com/send?text='+encodeURIComponent(t+' '+u),'_blank')}function fb(u){open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(u),'_blank')}function tw(t,u){open('https://twitter.com/intent/tweet?text='+encodeURIComponent(t)+'&url='+encodeURIComponent(u),'_blank')}function li(u){open('https://www.linkedin.com/sharing/share-offsite/?url='+encodeURIComponent(u),'_blank')}async function copy(u,msg='Link copiado.'){try{await navigator.clipboard.writeText(u);document.getElementById('shareStatus').textContent=msg}catch{prompt('Copie o link:',u)}}async function insta(t,u){if(navigator.share){try{await navigator.share({title:t,url:u});document.getElementById('shareStatus').textContent='Compartilhamento aberto. Selecione o Instagram, se disponível.';return}catch(e){if(e.name==='AbortError')return}}await copy(u,'Link copiado. Abra o Instagram e cole o link onde desejar compartilhar.')}
function atualizarTempo(){document.getElementById('tempo').textContent='Tempo: '+fmt(audio.currentTime)+' / '+fmt(audio.duration)}function velocidade(delta){audio.playbackRate=Math.max(.5,Math.min(2,Math.round((audio.playbackRate+delta)*100)/100));document.getElementById('vel').textContent='Velocidade: '+audio.playbackRate.toFixed(2)+'×'}function render(){document.title=r.titulo+' — Audire';document.getElementById('titulo').textContent=r.titulo;document.getElementById('repoNome').textContent=r.repositorio_titulo;document.getElementById('voltar').href='repositorio.html?id='+encodeURIComponent(r.repositorio_id);const u=shareUrl();document.getElementById('conteudo').innerHTML=`${r.imagem_url?`<img class="imagem" src="${esc(r.imagem_url)}" alt="">`:''}${r.audio_url?`<p>Use os botões para reproduzir ou pausar, voltar ou avançar 10 segundos e ajustar a velocidade.</p><audio id="audio" src="${esc(r.audio_url)}" preload="metadata"></audio><div class="controles"><button id="play" type="button">Reproduzir ou pausar</button><button id="back" type="button">Voltar 10 segundos</button><button id="forward" type="button">Avançar 10 segundos</button><button id="slower" type="button">Diminuir velocidade</button><button id="faster" type="button">Aumentar velocidade</button><div id="vel" class="status">Velocidade: 1.00×</div><div id="tempo" class="status" aria-live="off">Tempo: 0:00 / 0:00</div></div>`:''}<h2>Roteiro da audiodescrição</h2><div class="roteiro-texto">${esc(r.roteiro_texto||'')}</div><h2>Créditos</h2><div class="roteiro-texto">${esc(r.creditos||'')}</div><div class="share"><h2>Compartilhar</h2><button onclick="wa('${esc(r.titulo)}','${u}')">WhatsApp</button><button onclick="fb('${u}')">Facebook</button><button onclick="tw('${esc(r.titulo)}','${u}')">X</button><button onclick="li('${u}')">LinkedIn</button><button onclick="insta('${esc(r.titulo)}','${u}')">Instagram</button><button onclick="copy('${u}')">Copiar link</button><div id="shareStatus" class="status" role="status" aria-live="polite">Escolha uma opção de compartilhamento.</div></div>`;document.getElementById('conteudo').hidden=false;document.getElementById('status').hidden=true;if(r.audio_url){audio=document.getElementById('audio');audio.addEventListener('timeupdate',atualizarTempo);audio.addEventListener('loadedmetadata',atualizarTempo);document.getElementById('play').onclick=()=>audio.paused?audio.play():audio.pause();document.getElementById('back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-10);document.getElementById('forward').onclick=()=>audio.currentTime=Math.min(audio.duration||1e9,audio.currentTime+10);document.getElementById('slower').onclick=()=>velocidade(-.25);document.getElementById('faster').onclick=()=>velocidade(.25)}}
async function load(){const p=new URLSearchParams(location.search),id=p.get('id'),repoId=p.get('repositorio'),acesso=p.get('acesso');if(acesso&&repoId)setAccess(repoId,acesso);if(!id){document.getElementById('status').textContent='Roteiro não informado.';return}const headers={};if(repoId&&getAccess(repoId))headers['x-audire-presenca']=getAccess(repoId);try{const q=repoId?'?repositorio='+encodeURIComponent(repoId):'',resp=await fetch(API+'/audire/public/roteiros/'+encodeURIComponent(id)+q,{headers}),j=await resp.json().catch(()=>({}));if(!resp.ok)throw new Error(j.error||'Erro na API');r=j.roteiro;if(acesso)setAccess(r.repositorio_id,acesso);render()}catch(e){document.getElementById('status').textContent='Não foi possível abrir o roteiro: '+e.message}}load();
</script></body></html>
