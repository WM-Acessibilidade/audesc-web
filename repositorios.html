<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repositórios — Audire</title><style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;margin:0;background:#f7f7f7;color:#111}header,main{max-width:1100px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid #ccc;border-radius:12px;padding:18px;margin:16px 0}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}label{display:block;font-weight:700}input,select,button{font:inherit}input,select{width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid #888;border-radius:8px}button{padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#555}.status{padding:10px;border:1px solid #aaa;border-radius:8px;background:#f1f1f1;margin-top:10px}.lista{list-style:none;padding:0}.repo{display:grid;grid-template-columns:140px 1fr;gap:16px;border-top:1px solid #ddd;padding:16px 0}.repo img{width:140px;height:100px;object-fit:cover;border-radius:8px}.badge{display:inline-block;border:1px solid #777;border-radius:999px;padding:2px 8px}.categorias{display:flex;gap:10px;flex-wrap:wrap}.categorias label{font-weight:400}.small{font-size:.95rem;color:#444}@media(max-width:650px){header,main{padding:12px}.repo{grid-template-columns:1fr}.repo img{width:100%;height:auto}}
</style></head><body><header><h1>Audire — Repositórios de audiodescrição</h1><p>Descubra acervos de audiodescrição com roteiros escritos e versões gravadas em áudio.</p></header><main><section class="panel"><h2>Buscar repositórios</h2><div class="grid"><div><label for="busca">Campo de busca</label><input id="busca" type="search" placeholder="Digite título, descrição ou local"></div><div><label for="paisFiltro">País</label><select id="paisFiltro"></select></div><div><label for="ufFiltro" id="ufFiltroLabel">Unidade administrativa</label><select id="ufFiltro"></select></div></div><fieldset><legend>Categorias</legend><p class="small">Nenhuma categoria marcada exibe todas.</p><div id="categoriasFiltro" class="categorias"></div></fieldset><p><button type="button" id="usarLocalizacao">Usar minha localização para encontrar repositórios próximos</button> <button type="button" id="limparFiltros" class="secondary">Limpar filtros</button></p><div id="geoStatus" class="status" role="status" aria-live="polite">Localização não utilizada.</div><div id="summary" class="status" role="status" aria-live="polite">Carregando repositórios.</div></section><section class="panel"><h2>Repositórios públicos</h2><ul id="lista" class="lista"></ul></section></main><script src="data/paises-unidades.js"></script><script src="data/audire-categorias.js"></script><script>
const API='https://audesc-events-api.onrender.com',FOCUS_KEY='audire_repositorio_retorno_v1';let repositorios=[],coords=null,config={paises_habilitados:null};const busca=document.getElementById('busca'),pais=document.getElementById('paisFiltro'),uf=document.getElementById('ufFiltro'),ufLabel=document.getElementById('ufFiltroLabel');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function paisesAtivos(){const all=[...(window.AUDESC_LOCAIS?.paises||[])],a=config.paises_habilitados;return all.filter(p=>!Array.isArray(a)||a.includes(String(p.codigo).toUpperCase())).sort((x,y)=>x.nome.localeCompare(y.nome,'pt-BR',{sensitivity:'base'}))}
function initLocais(valor=''){pais.innerHTML='<option value="">Todos os países</option>'+paisesAtivos().map(p=>`<option value="${esc(p.nome)}">${esc(p.nome)}</option>`).join('');if(valor&&[...pais.options].some(o=>o.value===valor))pais.value=valor;preencherUf()}
function preencherUf(valor=''){const p=pais.value;uf.innerHTML='<option value="">Todas as unidades administrativas</option>';if(!p){uf.disabled=true;ufLabel.textContent='Unidade administrativa';return}const d=window.AUDESC_UNIDADES_ADMINISTRATIVAS?.[p];ufLabel.textContent=d?.rotulo||'Unidade administrativa';if(!d){uf.disabled=true;return}const ops=(d.opcoes||[]).map(item=>({v:Array.isArray(item)?item[0]:item,t:Array.isArray(item)?item[1]+' ('+item[0]+')':item})).sort((a,b)=>a.t.localeCompare(b.t,'pt-BR',{sensitivity:'base'}));for(const x of ops)uf.insertAdjacentHTML('beforeend',`<option value="${esc(x.v)}">${esc(x.t)}</option>`);uf.disabled=false;if(valor&&[...uf.options].some(o=>o.value===valor))uf.value=valor}
function initCategorias(){document.getElementById('categoriasFiltro').innerHTML=(window.AUDIRE_CATEGORIAS?.lista||[]).map(c=>`<label><input type="checkbox" class="cat" value="${esc(c.id)}"> ${esc(c.nome)}</label>`).join('')}
function distancia(a,b,c,d){const R=6371,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,z=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))}
function filtrados(){const q=norm(busca.value),cats=[...document.querySelectorAll('.cat:checked')].map(x=>x.value);let a=repositorios.filter(r=>(!q||norm([r.titulo,r.descricao,r.nome_local,r.endereco].join(' ')).includes(q))&&(!pais.value||r.pais===pais.value)&&(!uf.value||r.unidade_codigo===uf.value||r.unidade_administrativa===uf.value)&&(!cats.length||cats.includes(r.categoria)));if(coords)a=a.map(r=>({...r,_dist:Number.isFinite(Number(r.latitude))&&Number.isFinite(Number(r.longitude))?distancia(coords.lat,coords.lon,Number(r.latitude),Number(r.longitude)):null})).sort((x,y)=>(x._dist??1e12)-(y._dist??1e12));return a}
function render(){const a=filtrados(),root=document.getElementById('lista');document.getElementById('summary').textContent=`${a.length} repositório${a.length===1?'':'s'} exibido${a.length===1?'':'s'}.`;root.innerHTML=a.length?a.map(r=>`<li class="repo"><div>${r.imagem_url?`<img src="${esc(r.imagem_url)}" alt="${esc(r.imagem_alt||'')}">`:''}</div><div><h3><a id="repo-${esc(r.id)}" href="repositorio.html?id=${encodeURIComponent(r.id)}" data-id="${esc(r.id)}">${esc(r.titulo)}</a></h3><p><span class="badge">${esc(window.AUDIRE_CATEGORIAS?.nome(r.categoria)||r.categoria)}</span></p>${r.nome_local?`<p>${esc(r.nome_local)}</p>`:''}${r._dist!=null?`<p class="small">Aproximadamente ${r._dist.toFixed(1).replace('.',',')} km da sua localização.</p>`:''}</div></li>`).join(''):'<li>Nenhum repositório encontrado.</li>';root.querySelectorAll('a[data-id]').forEach(a=>a.addEventListener('click',()=>sessionStorage.setItem(FOCUS_KEY,a.dataset.id)));restaurarFoco()}
function restaurarFoco(){const id=sessionStorage.getItem(FOCUS_KEY);if(!id)return;const el=document.getElementById('repo-'+CSS.escape(id));if(el){sessionStorage.removeItem(FOCUS_KEY);setTimeout(()=>el.focus(),0)}}
async function aproximarPorIp(){try{const r=await fetch(API+'/localizacao-aproximada'),j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)return;const loc=j.localizacao||j;const p=(window.AUDESC_LOCAIS?.paises||[]).find(x=>String(x.codigo).toUpperCase()===String(loc.pais_codigo||loc.country_code||'').toUpperCase());if(!p||![...pais.options].some(o=>o.value===p.nome))return;pais.value=p.nome;preencherUf();const cod=String(loc.unidade_codigo||loc.uf||'');const nome=norm(loc.unidade_nome||'');const op=[...uf.options].find(o=>String(o.value).toUpperCase()===cod.toUpperCase()||norm(o.textContent).replace(/\s*\([^)]*\)\s*$/,'')===nome);if(op)uf.value=op.value;document.getElementById('geoStatus').textContent='Localização aproximada identificada automaticamente. País e unidade administrativa foram selecionados quando identificados. Você pode alterar os filtros.';render()}catch(e){console.warn('Localização aproximada por IP indisponível.',e)}}
async function carregar(){try{const r=await fetch(API+'/audire/public/repositorios'),j=await r.json();if(!r.ok)throw new Error(j.error||'Erro na API');repositorios=j.repositorios||[];config=j.config||config;initLocais();render();await aproximarPorIp()}catch(e){document.getElementById('summary').textContent='Erro: '+e.message}}
pais.addEventListener('change',()=>{preencherUf();render()});uf.addEventListener('change',render);busca.addEventListener('input',render);document.getElementById('categoriasFiltro').addEventListener('change',render);document.getElementById('usarLocalizacao').onclick=()=>{if(!navigator.geolocation){document.getElementById('geoStatus').textContent='Geolocalização não disponível.';return}document.getElementById('geoStatus').textContent='Obtendo localização...';navigator.geolocation.getCurrentPosition(p=>{coords={lat:p.coords.latitude,lon:p.coords.longitude};document.getElementById('geoStatus').textContent='Localização utilizada para ordenar por proximidade.';render()},e=>document.getElementById('geoStatus').textContent='Não foi possível obter a localização: '+e.message,{enableHighAccuracy:true,timeout:12000})};document.getElementById('limparFiltros').onclick=()=>{busca.value='';pais.value='';preencherUf();document.querySelectorAll('.cat').forEach(c=>c.checked=false);coords=null;document.getElementById('geoStatus').textContent='Filtros e localização foram limpos.';render()};initCategorias();carregar();
</script></body></html>
